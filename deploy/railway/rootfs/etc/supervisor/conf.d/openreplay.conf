[supervisord]
nodaemon=true
user=root
logfile=/var/log/openreplay/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

; Long-running backends (priority 10) start first, then the one-shot init (20),
; then chalice (30) which gates itself on init, then nginx (40).

[program:postgres]
command=/usr/lib/postgresql/17/bin/postgres -D %(ENV_PGDATA)s
user=postgres
priority=10
autorestart=true
startretries=1000000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:redis]
command=redis-server --dir %(ENV_REDIS_DATA)s --bind 127.0.0.1 --port 6379 --save "" --appendonly no
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:minio]
command=/usr/local/bin/minio server %(ENV_MINIO_DATA)s --address 127.0.0.1:9000
environment=MINIO_ROOT_USER="%(ENV_S3_KEY)s",MINIO_ROOT_PASSWORD="%(ENV_S3_SECRET)s"
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:init]
command=/usr/local/bin/or-init.sh
priority=20
autorestart=false
startsecs=0
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:chalice]
command=/usr/local/bin/or-chalice.sh
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
